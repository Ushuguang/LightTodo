plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lighttodo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lighttodo.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.5.0"
        resourceConfigurations += ["zh", "en"]
    }

    signingConfigs {
        release {
            storeFile file("../lighttodo.jks")
            storePassword "lighttodo"
            keyAlias "lighttodo"
            keyPassword "lighttodo"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}
